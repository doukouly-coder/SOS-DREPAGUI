<div class="connexion-carte bascule" id="connexion">
      <div class="onglets-mini">
        <p class="choix-item est-actif">Se connecter</p>
        <p class="choix-item">Créer un compte</p>
      </div>
      <form class="variante est-actif formulaire-carte" onsubmit="return false">
        <div class="champ"><label for="c-id">Téléphone ou e-mail</label><div class="champ-saisie"><input id="c-id" name="log" autocomplete="username" required placeholder="6XX XX XX XX"></div></div>
        <div class="champ"><label for="c-mdp">Mot de passe</label><div class="champ-saisie"><input id="c-mdp" name="pwd" type="password" autocomplete="current-password" required placeholder="••••••••"></div></div>
        <a class="lien-discret" href="#">Mot de passe oublié ?</a>
        <button class="btn btn-rouge btn-grand" type="submit">Se connecter</button>
        <p class="connexion-note"><svg><use href="#i-cadenas"></use></svg>Connexion chiffrée · vos données ne sont jamais partagées</p>
      </form>
      <form class="variante formulaire-carte" onsubmit="return false">
        <div class="champs">
          <div class="champ"><label for="i-prenom">Prénom</label><div class="champ-saisie"><input id="i-prenom" name="prenom" autocomplete="given-name" required></div></div>
          <div class="champ"><label for="i-nom">Nom</label><div class="champ-saisie"><input id="i-nom" name="nom" autocomplete="family-name" required></div></div>
        </div>
        <div class="champ"><label for="i-tel">Téléphone (WhatsApp)</label><div class="champ-saisie"><span class="prefixe">+224</span><input id="i-tel" name="tel" type="tel" inputmode="tel" autocomplete="tel-national" required></div></div>
        <div class="champ"><label for="i-mail">E-mail <small>facultatif</small></label><div class="champ-saisie"><input id="i-mail" name="mail" type="email" autocomplete="email"></div></div>
        <div class="champ"><label for="i-mdp">Mot de passe</label><div class="champ-saisie"><input id="i-mdp" name="mdp" type="password" autocomplete="new-password" minlength="8" required></div></div>
        <label class="consentement"><input type="checkbox" name="consentement" value="1" required><span>J’accepte les conditions d’utilisation et la <a href="a-propos.html#confidentialite">politique de confidentialité</a>.</span></label>
        <button class="btn btn-rouge btn-grand" type="submit">Créer mon compte</button>
      </form>
    </div>
