<article class="calc" id="calculs" data-calc="mentzer">
      <div class="calc-entrees">
        <div class="calc-tete"><span><i class="ico ico-score"></i></span><div><h2>Indice de Mentzer</h2><p>Microcytose : thalassémie ou carence en fer ?</p></div></div>
        <div class="champs">
          <div class="champ"><label for="m-vgm">VGM</label><div class="champ-saisie"><input id="m-vgm" name="vgm" inputmode="decimal" value="64"><span class="unite">fL</span></div></div>
          <div class="champ"><label for="m-gr">Globules rouges</label><div class="champ-saisie"><input id="m-gr" name="gr" inputmode="decimal" value="5,6"><span class="unite">T/L</span></div></div>
        </div>
      </div>
      <div class="calc-sortie" aria-live="polite">
        <p class="res-etiquette">Indice</p>
        <p class="res-valeur"><span data-sortie="indice">11,4</span></p>
        <p class="res-pastille" data-sortie="orientation">Évoque une thalassémie</p>
        <p class="res-note">Inférieur à 13 : thalassémie plus probable ; supérieur à 13 : carence martiale plus probable. Confirmer par ferritine et électrophorèse.</p>
      </div>
    </article>
