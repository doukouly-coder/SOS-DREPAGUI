<article class="calc" id="formule" data-calc="formule">
      <div class="calc-entrees">
        <div class="calc-tete"><span><i class="ico ico-graphe"></i></span><div><h2>Formule leucocytaire</h2><p>Valeurs absolues à partir des pourcentages.</p></div></div>
        <div class="champs">
          <div class="champ champ-large"><label for="f-gb">Leucocytes</label><div class="champ-saisie"><input id="f-gb" name="gb" inputmode="decimal" value="7,2"><span class="unite">G/L</span></div></div>
          <div class="champ"><label for="f-pnn">Neutrophiles</label><div class="champ-saisie"><input id="f-pnn" name="pnn" inputmode="decimal" value="58"><span class="unite">%</span></div></div>
          <div class="champ"><label for="f-ly">Lymphocytes</label><div class="champ-saisie"><input id="f-ly" name="ly" inputmode="decimal" value="30"><span class="unite">%</span></div></div>
          <div class="champ"><label for="f-mo">Monocytes</label><div class="champ-saisie"><input id="f-mo" name="mo" inputmode="decimal" value="7"><span class="unite">%</span></div></div>
          <div class="champ"><label for="f-eo">Éosinophiles</label><div class="champ-saisie"><input id="f-eo" name="eo" inputmode="decimal" value="4"><span class="unite">%</span></div></div>
          <div class="champ"><label for="f-ba">Basophiles</label><div class="champ-saisie"><input id="f-ba" name="ba" inputmode="decimal" value="1"><span class="unite">%</span></div></div>
        </div>
      </div>
      <div class="calc-sortie" aria-live="polite">
        <p class="res-etiquette">Valeurs absolues</p>
        <table class="res-table"><tbody data-sortie="table"><tr><td>Neutrophiles</td><td>4,18 G/L</td></tr></tbody></table>
        <p class="res-note" data-sortie="note">Total des pourcentages : 100 %.</p>
      </div>
    </article>
